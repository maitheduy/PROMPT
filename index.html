<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📚 Quản lý Prompt Nâng cao - Google Drive Sync - Fixed v4</title>
  
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3"></script>

  <script>
    tailwind.config = { darkMode: 'class' };
  </script>

  <style>
    /* ... (giữ nguyên các style cũ) ... */

    .prompt-card {
      transition: all 0.2s ease;
      border-left: 4px solid transparent;
    }
    .prompt-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      border-left-color: #6366f1;
    }

    /* === FIX TIÊU ĐỀ === */
    .prompt-title-fixed {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      font-size: 1.1rem !important;
      font-weight: 800 !important;
      line-height: 1.4 !important;
      color: #111827 !important;
      white-space: normal !important;
      overflow: visible !important;
      text-overflow: unset !important;
      max-width: none !important;
      flex: 1 1 auto !important;
      min-width: 0 !important;
    }
    .dark .prompt-title-fixed {
      color: #ffffff !important;
    }

    /* Đảm bảo flex cha không ép tiêu đề biến mất */
    .prompt-header-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 1 1 auto;
      min-width: 0;
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen p-4">

  <!-- ... (giữ nguyên phần body đến trước script) ... -->

  <script>
    // ==================== ... (giữ nguyên toàn bộ code cũ đến createPromptCard) ====================

    function createPromptCard(p, index, isCompact = false) {
      p = normalizePrompt(p, index);
      const safeTitle = p.title || p.name || `Prompt ${index + 1}`;

      return `
        <div class="prompt-card bg-white dark:bg-gray-750 border dark:border-gray-700 rounded-xl p-4 shadow-sm hover:shadow-md transition-all" 
          data-index="${index}">
          
          <!-- Card Header -->
          <div class="flex items-start justify-between gap-3 mb-3">
            <div class="prompt-header-left">
              <input type="checkbox" onchange="toggleSelection(${index})" 
                class="w-4 h-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 mt-0.5"
                ${state.selectedItems.has(index) ? 'checked' : ''} />
              
              <button onclick="toggleFavorite(${index})" 
                class="text-xl hover:scale-110 transition ${p.favorite ? 'text-amber-500' : 'text-gray-300 hover:text-amber-400'}">
                ${p.favorite ? '⭐' : '☆'}
              </button>
              
              <h3 class="prompt-title-fixed" title="${sanitize(safeTitle)}">
                📝 ${sanitize(safeTitle)}
              </h3>
            </div>
            
            <div class="flex items-center gap-1 flex-shrink-0">
              <span class="text-xs px-2 py-1 bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 rounded-full whitespace-nowrap">
                ${sanitize(p.category || 'Chưa phân loại')}
              </span>
            </div>
          </div>

          <!-- Phần còn lại giữ nguyên -->
          ${/* ... nội dung cũ ... */ ''}
        </div>
      `;
    }

    // Cải thiện hàm fix
    function fixEmptyStateAndTitles() {
      const emptyState = document.getElementById('emptyState');
      if (emptyState && state.prompts?.length > 0) {
        emptyState.classList.add('hidden', 'force-hidden');
        emptyState.style.display = 'none';
      }

      document.querySelectorAll('.prompt-card h3').forEach(h => {
        h.classList.add('prompt-title-fixed');
      });
    }

    // Monkey patch renderPrompts (chạy sau khi hàm đã định nghĩa)
    const originalRenderPrompts = renderPrompts;
    renderPrompts = function(...args) {
      const result = originalRenderPrompts.apply(this, args);
      setTimeout(fixEmptyStateAndTitles, 10); // delay nhỏ để DOM kịp render
      return result;
    };

    // Gọi fix thêm sau khi load
    document.addEventListener('DOMContentLoaded', () => {
      // ... code cũ ...
      setTimeout(fixEmptyStateAndTitles, 300);
    });

    // Expose functions...
    window.renderPrompts = renderPrompts;
    // ... các expose khác giữ nguyên
  </script>
</body>
</html>
